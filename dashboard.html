<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Dashboard Admin - Mall 23Semarang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="dashboard.css?v=14">
</head>
<body>

<!-- ============ MASUK ============ -->
<div class="masuk" id="masuk">
  <form class="masuk-kartu" id="form-masuk" autocomplete="on">
    <div class="masuk-kepala">
      <div><h1>Admin</h1><p>Mall 23Semarang</p></div>
    </div>
    <div class="pita" aria-hidden="true"></div>
    <div class="masuk-isi">
      <div class="medan"><label for="u">Nama pengguna</label><input id="u" class="input" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
      <div class="medan"><label for="p">Kata sandi</label><input id="p" class="input" type="password" autocomplete="current-password" required></div>
      <p id="g-masuk" class="galat" role="alert" hidden></p>
      <button type="submit" id="btn-masuk" class="btn btn-utama btn-lebar">Masuk</button>
      <p class="catatan">Halaman ini khusus admin, supervisor, dan manager. Petugas patroli tidak perlu masuk.</p>
    </div>
  </form>
</div>

<!-- ============ APLIKASI ============ -->
<div class="rangka" id="app" hidden>
  <aside class="sisi" id="sisi">
    <div class="sisi-merek">
      <div><b>Admin</b><span>Mall 23Semarang</span></div>
      <button type="button" class="btn-sisi-tutup" id="btn-sisi-tutup" aria-label="Minimalkan panel menu" title="Minimalkan panel menu">&#171;</button>
    </div>
    <nav class="menu" id="menu" aria-label="Menu utama"></nav>
    <div class="sisi-bawah">
      <div class="pengguna" id="pengguna"></div>
      <div class="sisi-aksi">
        <button type="button" class="btn btn-kecil btn-garis-terang" id="btn-sandi">Ganti kata sandi</button>
        <button type="button" class="btn btn-kecil btn-garis-terang" id="btn-keluar">Keluar</button>
      </div>
      <a class="tautan-petugas" href="index.html" target="_blank" rel="noopener">Buka form petugas</a>
    </div>
  </aside>

  <div class="utama">
    <header class="atas">
      <button type="button" class="btn-menu" id="btn-menu" aria-label="Sembunyikan menu" aria-expanded="true" aria-controls="sisi"><i></i><i></i><i></i></button>
      <h1 id="judul-halaman">Laporan</h1>
      <span class="atas-info" id="atas-info"></span>
      <div class="notif" id="notif">
        <button type="button" class="btn-ikon-atas" id="btn-notif" aria-label="Notifikasi" aria-expanded="false" aria-controls="panel-notif" title="Notifikasi">
          <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.6 2H4.4z"/><path d="M10 21h4"/></svg>
          <span class="notif-n" id="notif-n" hidden>0</span>
        </button>
        <div class="panel-notif" id="panel-notif" role="region" aria-label="Daftar notifikasi" hidden></div>
      </div>
      <button type="button" class="btn-ikon-atas" id="btn-penuh" aria-pressed="false" title="Layar penuh" aria-label="Layar penuh">
        <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </header>
    <div class="tirai-menu" id="tirai-menu"></div>
    <main class="isi" id="isi"></main>
  </div>
</div>

<div id="lapisan"></div>

<!-- ============ DIALOG ============ -->
<dialog class="dialog" id="dlg-sandi">
  <form id="form-sandi">
    <h3>Ganti kata sandi</h3>
    <div class="medan"><label for="s-lama">Kata sandi saat ini</label><input id="s-lama" class="input" type="password" autocomplete="current-password" required></div>
    <div class="medan"><label for="s-baru">Kata sandi baru (minimal 8 karakter)</label><input id="s-baru" class="input" type="password" autocomplete="new-password" minlength="8" required></div>
    <div class="medan"><label for="s-konf">Ulangi kata sandi baru</label><input id="s-konf" class="input" type="password" autocomplete="new-password" minlength="8" required></div>
    <p id="g-sandi" class="galat" role="alert" hidden></p>
    <div class="dialog-aksi">
      <button type="button" class="btn btn-garis" id="s-batal">Batal</button>
      <button type="submit" class="btn btn-utama" id="s-simpan">Simpan</button>
    </div>
  </form>
</dialog>

<dialog class="dialog" id="dlg-status">
  <form id="form-status">
    <h3 id="st-judul">Ubah status</h3>
    <p class="info" id="st-info"></p>
    <div class="medan"><label for="st-catatan" id="st-label">Catatan</label><textarea id="st-catatan" class="input" maxlength="300" rows="3"></textarea></div>
    <p id="g-status" class="galat" role="alert" hidden></p>
    <div class="dialog-aksi">
      <button type="button" class="btn btn-garis" id="st-batal">Batal</button>
      <button type="submit" class="btn btn-utama" id="st-simpan">Simpan</button>
    </div>
  </form>
</dialog>

<!-- Dialog serbaguna untuk form kelola (diisi oleh kelola.js) -->
<dialog class="dialog dialog-lebar" id="dlg-form">
  <form id="form-umum" novalidate>
    <h3 id="fm-judul"></h3>
    <p class="info" id="fm-info" hidden></p>
    <div id="fm-isi"></div>
    <p id="g-form" class="galat" role="alert" hidden></p>
    <div class="dialog-aksi">
      <button type="button" class="btn btn-garis" id="fm-batal">Batal</button>
      <button type="submit" class="btn btn-utama" id="fm-simpan">Simpan</button>
    </div>
  </form>
</dialog>

<script src="config.js?v=14"></script>
<script src="core.js?v=14"></script>
<script src="dashboard.js?v=14"></script>
<script src="laporan.js?v=14"></script>
<script src="cakupan.js?v=14"></script>
<script src="notif.js?v=14"></script>
<script src="tenant-awal.js?v=14"></script>
<script src="kelola.js?v=14"></script>
<script src="qrcode.js?v=14"></script>
<script src="qr.js?v=14"></script>
<script src="dashboard-mulai.js?v=14"></script>
</body>
</html>
