name: Deploy GAS Backend
on:
  push:
    branches: [main]
    paths: ["Code.gs", "appsscript.json", ".github/workflows/deploy-gas.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm i -g @google/clasp@2
      - run: echo "$CLASPRC_JSON" > "$HOME/.clasprc.json"
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      - run: echo '{"scriptId":"${{ secrets.SCRIPT_ID }}","rootDir":"."}' > .clasp.json
      - run: clasp push --force
      - run: clasp deploy --description "Auto-deploy $(date +'%Y-%m-%d %H:%M')"
