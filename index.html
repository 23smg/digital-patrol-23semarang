<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pelaporan Patroli - Mall 23Semarang</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a; /* Diubah ke Dark Slate agar kontras dan terkesan industrial/tactical */
            color: #f8fafc;
            padding: 1.5rem 0;
        }
        .main-card {
            background: #ffffff;
            border-radius: 8px; /* Diubah dari 24px ke 8px agar sudut lebih tegas/kotak */
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            border: 2px solid #334155;
            max-width: 480px;
            margin: 0 auto;
        }
        .card-header-navy {
            background-color: #0f172a;
            color: white;
            padding: 2rem 1.2rem;
            text-align: center;
            border-bottom: 4px solid #1e3a8a; /* Garis bawah biru tegas */
        }
        .card-header-navy h4 {
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 0.3rem;
            font-size: 1.35rem;
            color: #f8fafc;
        }
        .card-header-navy p {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
            color: #38bdf8; /* Sub-teks biru siber/formal */
            margin: 0;
        }
        .card-body-content {
            padding: 1.5rem 1.2rem;
            background-color: #ffffff;
            color: #1e293b;
        }
        .form-label-custom {
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #1e293b;
            display: block;
            text-align: left; /* Aligned left untuk pembacaan form yang formal */
            margin-bottom: 0.5rem;
            border-left: 3px solid #1e3a8a;
            padding-left: 6px;
        }
        .form-control-custom {
            border-radius: 6px; /* Sudut kotak */
            padding: 0.75rem 1rem;
            border: 1px solid #cbd5e1;
            background-color: #f8fafc;
            text-align: left;
            color: #0f172a;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .form-control-custom:focus {
            border-color: #1e3a8a;
            box-shadow: 0 0 0 2px rgba(30, 58, 138, 0.2);
            background-color: white;
        }
        
        /* DROPDOWN KUSTOM KOTAK */
        .wadah-pencarian-kustom {
            position: relative;
        }
        .box-hasil-kustom {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #1e3a8a;
            border-radius: 6px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1050;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            margin-top: 2px;
        }
        .item-list-kustom {
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            text-align: left;
            border-bottom: 1px solid #f1f5f9;
        }
        .item-list-kustom:hover {
            background-color: #1e3a8a;
            color: white;
        }

        /* CHECKLIST FORM DESIGN STRAIGHT LINES */
        .checklist-container {
            background: #ffffff;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            padding: 0;
            margin-bottom: 1rem;
            overflow: hidden;
        }
        .table-checklist {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .table-checklist th {
            background-color: #0f172a;
            color: #ffffff;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
            padding: 10px 6px;
            border: none;
            text-align: center;
        }
        .table-checklist th:first-child {
            text-align: left;
            padding-left: 10px;
        }
        .table-checklist td {
            padding: 10px 6px;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: middle;
            font-weight: 600;
        }
        .input-remark {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        .input-remark:focus {
            border-color: #1e3a8a;
            outline: none;
        }

        .btn-camera {
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 0.75rem;
            width: 100%;
            color: #1e3a8a;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-camera:hover {
            background-color: #e2e8f0;
        }
        .status-gps-box {
            background-color: #f0fdf4;
            color: #166534;
            border-radius: 6px;
            padding: 0.75rem;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid #bbf7d0;
        }
        .status-gps-box.loading {
            background-color: #fffbeh;
            color: #92400e;
            border-color: #fde68a;
        }
        .btn-submit-navy {
            background-color: #1e3a8a;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0.9rem;
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s;
        }
        .btn-submit-navy:hover {
            background-color: #1e40af;
        }
        .btn-refresh-circle {
            background-color: white;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            width: 48px;
            height: 48px;
            color: #64748b;
        }
        .preview-img-tag {
            max-height: 120px;
            border-radius: 4px;
            border: 2px solid #cbd5e1;
        }
        .dev-watermark {
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-card">
            <div class="card-header-navy">
                <h4>DIGITAL PATROL LOG</h4>
                <p>Sistem Pelaporan Area Kerja • Mall 23Semarang</p>
            </div>

            <div class="card-body-content">
                <form id="formPatroli">
                    
                    <div class="mb-4 wadah-pencarian-kustom">
                        <label class="form-label-custom">Nama Petugas (Ketik Untuk Mencari)</label>
                        <input type="text" id="namaPetugasInput" class="form-control form-control-custom w-100" placeholder="Cari nama personel di sini..." required autocomplete="off" oninput="filterNamaLive(this.value)" onfocus="tampilkanBoxNama()">
                        <div id="boxHasilNama" class="box-hasil-kustom"></div>
                    </div>

                    <div class="mb-4 wadah-pencarian-kustom">
                        <label class="form-label-custom">Zona Inspeksi (Ketik Untuk Mencari)</label>
                        <input type="text" id="zonaAreaInput" class="form-control form-control-custom w-100" placeholder="Cari titik sektor/area di sini..." required autocomplete="off" oninput="filterZonaLive(this.value)" onfocus="tampilkanBoxZona()">
                        <div id="boxHasilZona" class="box-hasil-kustom"></div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label-custom">Kondisi Komponen Sektor Area</label>
                        <div class="checklist-container">
                            <table class="table-checklist">
                                <thead>
                                    <tr>
                                        <th style="text-align: left; padding-left: 10px;">Item Proteksi</th>
                                        <th style="width: 50px;">Baik</th>
                                        <th style="width: 50px;">Tidak</th>
                                        <th>Keterangan / Remark</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr class="item-baris" data-item="Pintu Tangga Darurat">
                                        <td style="font-weight: 500; color: #334155; padding-left: 10px;">Pintu T. Darurat</td>
                                        <td style="text-align: center;"><input type="radio" name="pintu" value="Baik" class="radio-custom" checked></td>
                                        <td style="text-align: center;"><input type="radio" name="pintu" value="Tidak" class="radio-custom"></td>
                                        <td><input type="text" class="input-remark" placeholder="Catatan temuan..."></td>
                                    </tr>
                                    <tr class="item-baris" data-item="Lantai">
                                        <td style="font-weight: 500; color: #334155; padding-left: 10px;">Lantai</td>
                                        <td style="text-align: center;"><input type="radio" name="lantai" value="Baik" class="radio-custom" checked></td>
                                        <td style="text-align: center;"><input type="radio" name="lantai" value="Tidak" class="radio-custom"></td>
                                        <td><input type="text" class="input-remark" placeholder="Catatan temuan..."></td>
                                    </tr>
                                    <tr class="item-baris" data-item="Dinding">
                                        <td style="font-weight: 500; color: #334155; padding-left: 10px;">Dinding</td>
                                        <td style="text-align: center;"><input type="radio" name="dinding" value="Baik" class="radio-custom" checked></td>
                                        <td style="text-align: center;"><input type="radio" name="dinding" value="Tidak" class="radio-custom"></td>
                                        <td><input type="text" class="input-remark" placeholder="Catatan temuan..."></td>
                                    </tr>
                                    <tr class="item-baris" data-item="Penerangan">
                                        <td style="font-weight: 500; color: #334155; padding-left: 10px;">Penerangan</td>
                                        <td style="text-align: center;"><input type="radio" name="penerangan" value="Baik" class="radio-custom" checked></td>
                                        <td style="text-align: center;"><input type="radio" name="penerangan" value="Tidak" class="radio-custom"></td>
                                        <td><input type="text" class="input-remark" placeholder="Catatan temuan..."></td>
                                    </tr>
                                    <tr class="item-baris" data-item="Kebersihan">
                                        <td style="font-weight: 500; color: #334155; padding-left: 10px;">Kebersihan</td>
                                        <td style="text-align: center;"><input type="radio" name="kebersihan" value="Baik" class="radio-custom" checked></td>
                                        <td style="text-align: center;"><input type="radio" name="kebersihan" value="Tidak" class="radio-custom"></td>
                                        <td><input type="text" class="input-remark" placeholder="Catatan temuan..."></td>
                                    </tr>
                                    <tr class="item-baris" data-item="Safety Equipment">
                                        <td style="font-weight: 500; color: #334155; padding-left: 10px;">Safety Equip.</td>
                                        <td style="text-align: center;"><input type="radio" name="safety" value="Baik" class="radio-custom" checked></td>
                                        <td style="text-align: center;"><input type="radio" name="safety" value="Tidak" class="radio-custom"></td>
                                        <td><input type="text" class="input-remark" placeholder="Catatan temuan..."></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label-custom">Catatan Tambahan Personel (Opsional)</label>
                        <textarea id="catatanPetugas" class="form-control form-control-custom w-100" rows="2" placeholder="Tulis instruksi/kronologi khusus di sini jika ada..." style="text-align: left; text-align-last: left; border-radius: 12px; resize: none;"></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label-custom">Dokumentasi Visual</label>
                        <button type="button" class="btn-camera" onclick="picuInputKameraHP()">
                            <i class="fa-solid fa-camera text-primary"></i> <span id="textTombolKamera">Buka Kamera Perangkat</span>
                        </button>
                        <input type="file" id="fileFoto" accept="image/*" capture="environment" onchange="prosesPratinjauFoto(this)">
                        <div class="preview-img-container d-none" id="boxPreviewFoto">
                            <img src="" id="imgTargetPreview" class="preview-img-tag">
                        </div>
                    </div>

                    <div class="mb-4">
                        <div id="gpsStatusBox" class="status-gps-box loading">
                            <i id="gpsIcon" class="fa-solid fa-circle-notch fa-spin"></i> 
                            <span id="gpsTextStatus">Menghubungkan Otorisasi GPS...</span>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="button" class="btn-refresh-circle" onclick="location.reload()" title="Reset Form">
                            <i class="fa-solid fa-rotate"></i>
                        </button>
                        <button type="submit" id="btnSubmit" class="btn btn-submit-navy w-100" disabled>
                            Kirim Log Laporan
                        </button>
                    </div>

                </form>
                
                <div class="dev-watermark">
                    <div>Developed by <strong>Alif Rizal</strong> • IT Department</div>
                    <div><i class="fa-regular fa-envelope me-1"></i><a href="mailto:alif.rizal@23semarang.id">alif.rizal@23semarang.id</a></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        const API_URL_WEBAPP = "https://script.google.com/macros/s/AKfycbyJuzwTGe-bucxDG6Yvgp-GEEsk5RdUpjR7ZX-G6KL_PlkiAn6QhustBE5n2fWBVrmA/exec";
        let GAMBAR_TERKOMPRES_BASE64 = ""; 
        let STATUS_GPS_VALID = false; 
        let DAFTAR_NAMA_MASTER = []; 
        let DAFTAR_ZONA_MASTER = []; 

        document.addEventListener("DOMContentLoaded", function() {
            fetch(`${API_URL_WEBAPP}?aksi=ambilDropdown`)
            .then(res => res.json())
            .then(data => {
                if(data.daftarNama) { DAFTAR_NAMA_MASTER = data.daftarNama; buatUlangListNama(DAFTAR_NAMA_MASTER); }
                if(data.daftarZona) { DAFTAR_ZONA_MASTER = data.daftarZona; buatUlangListZona(DAFTAR_ZONA_MASTER); }
            })
            .catch(err => { console.log("Gagal sinkronisasi dropdown"); });
            
            aktifkanSistemGeotaggingGPS();

            document.addEventListener("click", function(e) {
                if (!e.target.closest('.wadah-pencarian-kustom')) {
                    document.getElementById("boxHasilNama").style.display = "none";
                    document.getElementById("boxHasilZona").style.display = "none";
                }
            });
        });

        function kompilasiDataTabelChecklist() {
            let rangkaianTeksItem = [];
            let statusAdaTemuanMemburuk = false;
            document.querySelectorAll(".item-baris").forEach(function(row) {
                let namaKomponen = row.getAttribute("data-item");
                let opsiDipilih = row.querySelector("input[type='radio']:checked").value;
                let keteranganKecil = row.querySelector(".input-remark").value.trim();
                let teksStatusItem = namaKomponen + ": " + opsiDipilih;
                if (opsiDipilih === "Tidak") {
                    statusAdaTemuanMemburuk = true;
                    teksStatusItem += keteranganKecil !== "" ? " (" + keteranganKecil + ")" : " (Tanpa Keterangan)";
                }
                rangkaianTeksItem.push(teksStatusItem);
            });
            return { kondisiGlobal: statusAdaTemuanMemburuk ? "Ada Temuan" : "Aman", stringGabunganCatatan: rangkaianTeksItem.join(", ") };
        }

        // ================= SEARCH LOGIC =================
        function buatUlangListNama(arrayNama) {
            const bNama = document.getElementById("boxHasilNama"); bNama.innerHTML = "";
            if(arrayNama.length === 0) { bNama.innerHTML = `<div class="item-list-kustom tidak-ada">Nama tidak ditemukan...</div>`; return; }
            arrayNama.forEach(nama => {
                const div = document.createElement("div"); div.className = "item-list-kustom"; div.innerText = nama;
                div.onclick = function() { document.getElementById("namaPetugasInput").value = nama; bNama.style.display = "none"; };
                bNama.appendChild(div);
            });
        }
        function filterNamaLive(kataKunci) {
            const hasilSaringan = DAFTAR_NAMA_MASTER.filter(nama => nama.toLowerCase().includes(kataKunci.toLowerCase().trim()));
            buatUlangListNama(hasilSaringan); document.getElementById("boxHasilNama").style.display = "block";
        }
        function tampilkanBoxNama() {
            document.getElementById("boxHasilZona").style.display = "none"; const inp = document.getElementById("namaPetugasInput");
            if(inp.value !== "") { filterNamaLive(inp.value); } else { buatUlangListNama(DAFTAR_NAMA_MASTER); document.getElementById("boxHasilNama").style.display = "block"; }
        }
        function buatUlangListZona(arrayZona) {
            const bZona = document.getElementById("boxHasilZona"); bZona.innerHTML = "";
            if(arrayZona.length === 0) { bZona.innerHTML = `<div class="item-list-kustom tidak-ada">Zona tidak ditemukan...</div>`; return; }
            arrayZona.forEach(zona => {
                const div = document.createElement("div"); div.className = "item-list-kustom"; div.innerText = zona;
                div.onclick = function() { document.getElementById("zonaAreaInput").value = zona; bZona.style.display = "none"; };
                bZona.appendChild(div);
            });
        }
        function filterZonaLive(kataKunci) {
            const hasilSaringan = DAFTAR_ZONA_MASTER.filter(zona => zona.toLowerCase().includes(kataKunci.toLowerCase().trim()));
            buatUlangListZona(hasilSaringan); document.getElementById("boxHasilZona").style.display = "block";
        }
        function tampilkanBoxZona() {
            document.getElementById("boxHasilNama").style.display = "none"; const inp = document.getElementById("zonaAreaInput");
            if(inp.value !== "") { filterZonaLive(inp.value); } else { buatUlangListZona(DAFTAR_ZONA_MASTER); document.getElementById("boxHasilZona").style.display = "block"; }
        }

        // ================= KILAT & ULTRA COMPRESSION =================
        function picuInputKameraHP() { document.getElementById('fileFoto').click(); }
        function prosesPratinjauFoto(input) {
            const file = input.files[0];
            if (file) {
                document.getElementById('textTombolKamera').innerText = "Membaca Kamera...";
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width; let height = img.height;
                        
                        // Maksimal lebar/tinggi diubah ke 700px (Sangat ringan untuk internet seluler)
                        const MAX_WIDTH_HEIGHT = 700; 
                        if (width > height) { if (width > MAX_WIDTH_HEIGHT) { height *= MAX_WIDTH_HEIGHT / width; width = MAX_WIDTH_HEIGHT; } }
                        else { if (height > MAX_WIDTH_HEIGHT) { width *= MAX_WIDTH_HEIGHT / height; height = MAX_WIDTH_HEIGHT; } }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                        
                        // Kualitas diturunkan ke 0.4 (Ukuran file menyusut tajam di bawah 150KB, unggah instan!)
                        GAMBAR_TERKOMPRES_BASE64 = canvas.toDataURL('image/jpeg', 0.4).split(',')[1];
                        document.getElementById('imgTargetPreview').src = canvas.toDataURL('image/jpeg', 0.4);
                        document.getElementById('boxPreviewFoto').classList.remove('d-none');
                        document.getElementById('textTombolKamera').innerText = "📷 Dokumentasi Terkunci (Siap)";
                    }
                }
                reader.readAsDataURL(file);
            }
        }

        function aktifkanSistemGeotaggingGPS() {
            const box = document.getElementById('gpsStatusBox'); const icon = document.getElementById('gpsIcon');
            const text = document.getElementById('gpsTextStatus'); const btnKirim = document.getElementById('btnSubmit');
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    window.latCoordinate = pos.coords.latitude; window.lngCoordinate = pos.coords.longitude;
                    STATUS_GPS_VALID = true; box.className = "status-gps-box"; icon.className = "fa-solid fa-location-dot text-success";
                    text.innerText = "Lokasi GPS Berhasil Diotorisasi"; btnKirim.disabled = false;
                }, err => {
                    STATUS_GPS_VALID = false; box.className = "status-gps-box text-danger bg-danger bg-opacity-10 border-danger";
                    icon.className = "fa-solid fa-triangle-exclamation"; text.innerText = "Izin GPS Diperlukan Lapangan!"; btnKirim.disabled = false; 
                }, { enableHighAccuracy: true });
            } else { STATUS_GPS_VALID = false; text.innerText = "Gps Tidak Didukung Browser"; btnKirim.disabled = false; }
        }

        // ================= SECURE SECONDS SUBMISSION =================
        document.getElementById('formPatroli').addEventListener('submit', function(e) {
            e.preventDefault();
            const nilaiNamaKetik = document.getElementById('namaPetugasInput').value.trim();
            const nilaiZonaKetik = document.getElementById('zonaAreaInput').value.trim();
            const catatanTambahanManual = document.getElementById('catatanPetugas').value.trim();
            const fileKomponen = document.getElementById('fileFoto').files[0];

            if(DAFTAR_NAMA_MASTER.length > 0 && !DAFTAR_NAMA_MASTER.includes(nilaiNamaKetik)) {
                Swal.fire({ icon: 'warning', title: 'Personel Tidak Valid', text: 'Nama Anda tidak terdaftar.', confirmButtonColor: '#0b132b' }); return;
            }
            if(DAFTAR_ZONA_MASTER.length > 0 && !DAFTAR_ZONA_MASTER.includes(nilaiZonaKetik)) {
                Swal.fire({ icon: 'warning', title: 'Zona Tidak Valid', text: 'Nama Sektor tidak terdaftar.', confirmButtonColor: '#0b132b' }); return;
            }
            if (!STATUS_GPS_VALID || !window.latCoordinate || !window.lngCoordinate) {
                Swal.fire({ icon: 'error', title: 'Akses Kirim Ditolak!', text: 'Aktifkan GPS perangkat Anda.', confirmButtonColor: '#d33' }); return;
            }
            if(!fileKomponen || !GAMBAR_TERKOMPRES_BASE64) {
                Swal.fire({ icon: 'warning', title: 'Dokumentasi Wajib', text: 'Wajib lampirkan foto bukti area.', confirmButtonColor: '#0b132b' }); return;
            }

            const rekapanChecklist = kompilasiDataTabelChecklist();
            let catatanAkhir = rekapanChecklist.stringGabunganCatatan;
            if (catatanTambahanManual !== "") { catatanAkhir += " | Catatan: " + catatanTambahanManual; }

            // Menampilkan loading indikator interaktif yang profesional agar user tahu data sedang berpindah
            Swal.fire({ 
                title: 'Mengirim Laporan...', 
                text: 'Menyinkronkan data log dan foto ke server pusat...', 
                allowOutsideClick: false, 
                allowEscapeKey: false, 
                showConfirmButton: false, 
                didOpen: () => { Swal.showLoading(); } 
            });

            const paketKirim = {
                aksi: "simpanData",
                payload: {
                    nama: nilaiNamaKetik,
                    zona: nilaiZonaKetik,
                    kondisi: rekapanChecklist.kondisiGlobal,
                    catatan: catatanAkhir,
                    fotoBase64: GAMBAR_TERKOMPRES_BASE64,
                    fotoMime: "image/jpeg",
                    lat: window.latCoordinate,
                    lng: window.lngCoordinate
                }
            };

            // Menggunakan FETCH standar yang aman untuk transmisi data Base64
            fetch(API_URL_WEBAPP, { method: "POST", body: JSON.stringify(paketKirim) })
            .then(res => res.json())
            .then(hasil => {
                if(hasil.status === "SUCCESS") {
                    Swal.fire({ 
                        icon: 'success', 
                        title: 'Log Berhasil Dicatat', 
                        text: 'Laporan patroli real-time Anda telah aman disinkronisasi.', 
                        confirmButtonColor: '#0b132b', 
                        allowOutsideClick: false 
                    })
                    .then((result) => { if (result.isConfirmed) location.reload(); });
                } else {
                    Swal.fire({ icon: 'error', title: 'Gagal Menyimpan', text: 'Respon server: ' + hasil.message, confirmButtonColor: '#d33' });
                }
            })
            .catch(err => {
                Swal.fire({ icon: 'error', title: 'Gangguan Sinyal', text: 'Gagal terhubung ke server utama. Pastikan koneksi internet Anda aktif.', confirmButtonColor: '#d33' });
            });
        });
    </script>
</body>
</html>
