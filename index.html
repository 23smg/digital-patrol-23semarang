<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Digital Patrol - Mall 23Semarang</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="petugas.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="icon"><i class="fa-solid fa-shield-halved"></i></div>
    <h1>DIGITAL PATROL LOG</h1>
    <p>Sistem Kontrol Keliling Mall 23Semarang</p>
  </div>

  <div class="card-app">
    <div id="loadingInit" style="text-align:center;padding:24px 0">
      <div class="spinner-border text-primary spinner-border-sm"></div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:10px">Menyelaraskan data komponen...</div>
    </div>

    <div id="alertBox" class="alert-inline"></div>

    <form id="formPatroli" onsubmit="kirimLaporan(event)" style="display:none">
      <div class="mb-3">
        <label class="lbl">Nama Personel Satpam</label>
        <div class="search-wrap">
          <input type="text" id="pNama" class="form-control" placeholder="Ketik & cari nama..." required autocomplete="off" oninput="filterNama(this.value)" onfocus="bukaHasil(this.value)">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <div id="pHasil" class="result-box"></div>
        </div>
      </div>

      <div class="mb-3">
        <label class="lbl">Zona Area Sektor</label>
        <select id="pZona" class="form-select" required></select>
      </div>

      <div class="section-title"><i class="fa-solid fa-list-check"></i> Checklist Pemeriksaan</div>
      <div id="pChecklist"></div>

      <div class="mb-3" style="margin-top:16px">
        <label class="lbl">Catatan Tambahan (opsional)</label>
        <textarea id="pCatatan" class="form-control" rows="2" placeholder="Tambahkan info lain..." maxlength="500"></textarea>
      </div>

      <div id="pTingkatWrap" class="mb-3" style="display:none">
        <label class="lbl" style="color:#fca5a5">Tingkat Temuan</label>
        <select id="pTingkat" class="form-select">
          <option value="">-- Pilih tingkat --</option>
          <option value="Rendah">Rendah</option>
          <option value="Sedang">Sedang</option>
          <option value="Tinggi">Tinggi</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="lbl">Foto Bukti (wajib)</label>
        <input type="file" id="pFoto" class="form-control" accept="image/*" capture="environment" onchange="prosesFoto(this)" required>
        <div class="hint">Foto otomatis dikompres ke 800px, kualitas 75%.</div>
        <img id="pPreview" class="foto-preview" alt="Preview">
      </div>

      <div class="gps" id="pGpsBox">
        <i class="fa-solid fa-location-crosshairs" style="color:var(--accent)" id="pGpsIcon"></i>
        <span id="pGpsText" style="color:var(--muted)">Mengunci titik koordinat GPS...</span>
      </div>

      <button type="submit" id="pBtn" class="btn-submit" disabled>
        <i class="fa-solid fa-cloud-arrow-up"></i> SIMPAN LOG PATROLI
      </button>
    </form>
  </div>

  <div class="watermark">Digital Patrol System v3.0 • Mall 23Semarang</div>
</div>

<script src="config.js"></script>
<script src="core.js"></script>
<script>
var master = { daftarNama: [], daftarZona: [], checklist: [] };
var gps = { lat: "-", lng: "-", akurasi: "" };
var foto = null;
var checklist = [];
var mulai = Date.now();

function alertBox(msg, tipe) {
  var a = DP.el('alertBox');
  a.textContent = msg;
  if (tipe === 'ok') {
    a.style.background = 'rgba(16,185,129,.12)';
    a.style.border = '1px solid var(--ok)';
    a.style.color = '#6ee7b7';
  } else {
    a.style.background = 'rgba(239,68,68,.12)';
    a.style.border = '1px solid var(--err)';
    a.style.color = '#fca5a5';
  }
  a.style.display = 'block';
  clearTimeout(a._t);
  a._t = setTimeout(function () { a.style.display = 'none'; }, 5000);
}

window.addEventListener('load', function () {
  DP.api({ aksi: 'ambilDropdown' })
    .then(function (d) {
      if (d.status === 'ERROR') throw new Error(d.message);
      master.daftarNama = d.daftarNama || [];
      master.daftarZona = d.daftarZona || [];
      master.checklist = (d.checklist && d.checklist.PATROLI) || [];
      isiSelect('pZona', master.daftarZona);
      renderChecklist(master.checklist);
      DP.show('loadingInit', 'none');
      DP.el('formPatroli').style.display = 'block';
      DP.sinkronJam();
    })
    .catch(function (err) {
      DP.el('loadingInit').innerHTML = '<div style="color:#fca5a5;font-size:12.5px">Gagal memuat: ' + (err.message || 'error') + '</div>';
    });

  kunciGps();

  document.addEventListener('click', function (e) {
    if (!e.target.closest('.search-wrap')) DP.show('pHasil', 'none');
  });
});

function isiSelect(id, arr) {
  var s = DP.el(id);
  s.innerHTML = '<option value="" disabled selected>-- Pilih --</option>';
  (arr || []).forEach(function (v) {
    var o = document.createElement('option');
    o.value = v; o.textContent = v;
    s.appendChild(o);
  });
}

function renderHasilNama(arr) {
  var box = DP.el('pHasil');
  box.innerHTML = '';
  if (!arr.length) {
    box.innerHTML = '<div class="result-item empty">Nama tidak ditemukan</div>';
  } else {
    arr.forEach(function (n) {
      var d = document.createElement('div');
      d.className = 'result-item';
      d.textContent = n;
      d.onclick = function () { DP.el('pNama').value = n; box.style.display = 'none'; };
      box.appendChild(d);
    });
  }
  box.style.display = 'block';
}

function filterNama(q) {
  var k = q.toLowerCase().trim();
  var hasil = master.daftarNama.filter(function (n) { return n.toLowerCase().indexOf(k) >= 0; });
  renderHasilNama(hasil);
}

function bukaHasil(q) {
  if (q.trim()) filterNama(q);
  else renderHasilNama(master.daftarNama);
}

function renderChecklist(items) {
  var w = DP.el('pChecklist');
  w.innerHTML = '';
  checklist = items.map(function (i) { return { i: i, s: '', c: '' }; });
  items.forEach(function (item, idx) {
    var d = document.createElement('div');
    d.className = 'checklist-item';
    d.dataset.idx = idx;
    d.innerHTML =
      '<div class="head">' +
        '<div class="name">' + DP.esc(item) + '</div>' +
        '<div class="opts">' +
          '<button type="button" class="opt" data-v="OK" onclick="setOpt(' + idx + ',\'OK\')">OK</button>' +
          '<button type="button" class="opt" data-v="TEMUAN" onclick="setOpt(' + idx + ',\'TEMUAN\')">Temuan</button>' +
          '<button type="button" class="opt" data-v="NA" onclick="setOpt(' + idx + ',\'NA\')">N/A</button>' +
        '</div>' +
      '</div>' +
      '<input type="text" class="catatan" placeholder="Jelaskan temuan..." oninput="setCatatan(' + idx + ',this.value)">';
    w.appendChild(d);
  });
}

function setOpt(idx, val) {
  checklist[idx].s = val;
  var item = document.querySelector('#pChecklist .checklist-item[data-idx="' + idx + '"]');
  item.querySelectorAll('.opt').forEach(function (b) { b.classList.toggle('active', b.dataset.v === val); });
  item.classList.toggle('temuan', val === 'TEMUAN');
  if (val === 'TEMUAN') item.querySelector('.catatan').focus();
  updateTingkat();
}

function setCatatan(idx, val) { checklist[idx].c = val; }

function updateTingkat() {
  var ada = checklist.some(function (x) { return x.s === 'TEMUAN'; });
  DP.show('pTingkatWrap', ada ? 'block' : 'none');
  if (!ada) DP.el('pTingkat').value = '';
}

function kunciGps() {
  if (!navigator.geolocation) {
    setGpsStatus('err', 'GPS tidak didukung.');
    DP.el('pBtn').disabled = false;
    return;
  }
  navigator.geolocation.getCurrentPosition(
    function (pos) {
      gps.lat = pos.coords.latitude;
      gps.lng = pos.coords.longitude;
      gps.akurasi = Math.round(pos.coords.accuracy || 0);
      setGpsStatus('ok', 'GPS terkunci • akurasi ±' + gps.akurasi + ' m');
      DP.el('pBtn').disabled = false;
    },
    function () {
      setGpsStatus('err', 'Izin GPS ditolak. Laporan tetap bisa dikirim.');
      DP.el('pBtn').disabled = false;
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

function setGpsStatus(status, text) {
  var box = DP.el('pGpsBox'), icon = DP.el('pGpsIcon'), txt = DP.el('pGpsText');
  box.classList.remove('ok', 'err');
  box.classList.add(status);
  icon.className = status === 'ok' ? 'fa-solid fa-circle-check' : 'fa-solid fa-triangle-exclamation';
  icon.style.color = status === 'ok' ? 'var(--ok)' : 'var(--warn)';
  txt.textContent = text;
  txt.style.color = status === 'ok' ? '#6ee7b7' : '#fcd34d';
}

function prosesFoto(input) {
  if (!input.files || !input.files[0]) return;
  DP.kompresFoto(input.files[0], 800, 0.75)
    .then(function (f) {
      foto = f;
      var prev = DP.el('pPreview');
      prev.src = 'data:image/jpeg;base64,' + f.b64;
      prev.style.display = 'block';
    })
    .catch(function () { alertBox('Gagal memproses foto.', 'err'); });
}

function kirimLaporan(e) {
  e.preventDefault();
  var nama = DP.el('pNama').value.trim();
  var btn = DP.el('pBtn');

  if (master.daftarNama.length && master.daftarNama.indexOf(nama) < 0) {
    alertBox('Nama personel tidak terdaftar. Pilih dari daftar.');
    return;
  }
  if (!checklist.length) { alertBox('Checklist belum dimuat.'); return; }
  for (var i = 0; i < checklist.length; i++) {
    var c = checklist[i];
    if (!c.s) { alertBox('Item "' + c.i + '" belum dijawab.'); return; }
    if (c.s === 'TEMUAN' && c.c.trim().length < 3) { alertBox('Jelaskan temuan pada item "' + c.i + '".'); return; }
  }
  if (!foto) { alertBox('Foto bukti wajib diambil.'); return; }

  var adaTemuan = checklist.some(function (x) { return x.s === 'TEMUAN'; });
  var tingkat = adaTemuan ? DP.el('pTingkat').value : '-';
  if (adaTemuan && !tingkat) { alertBox('Pilih tingkat temuan.'); return; }

  var payload = {
    nama: nama,
    zona: DP.el('pZona').value,
    checklist: checklist,
    catatan: DP.el('pCatatan').value.trim(),
    tingkat: tingkat,
    lat: gps.lat, lng: gps.lng, akurasi: gps.akurasi,
    fotos: [foto],
    id: DP.buatId(),
    durasiDetik: Math.round((Date.now() - mulai) / 1000),
    jamPerangkat: false, tertunda: false
  };

  btn.disabled = true;
  btn.innerHTML = '<div class="spinner-border spinner-border-sm"></div> Memproses...';

  DP.api({ aksi: 'simpanPatroli', payload: payload })
    .then(function (res) {
      if (res.status === 'SUCCESS') {
        alertBox('✓ Laporan tersimpan ' + (res.waktu || ''), 'ok');
        resetForm();
      } else {
        alertBox('Gagal: ' + res.message);
      }
    })
    .catch(function () { alertBox('Gangguan jaringan. Coba lagi.'); })
    .finally(function () {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> SIMPAN LOG PATROLI';
    });
}

function resetForm() {
  DP.el('pNama').value = '';
  DP.el('pZona').value = '';
  DP.el('pCatatan').value = '';
  DP.el('pFoto').value = '';
  DP.el('pPreview').style.display = 'none';
  DP.el('pPreview').src = '';
  foto = null;
  mulai = Date.now();
  renderChecklist(master.checklist);
  updateTingkat();
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</body>
</html>
