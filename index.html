<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://script.google.com https://script.googleusercontent.com; media-src blob:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Patrol 23">
<script src="tema.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Patroli - Mall 23Semarang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="petugas.css?v=15">
</head>
<body>

<header class="kepala">
  <div class="kepala-isi">
    <div class="merek-grup">
      <div>
        <div class="judul">Patroli Digital</div>
        <div class="sub">Mall 23Semarang</div>
      </div>
    </div>
    <nav class="nav-app" aria-label="Halaman">
      <a href="index.html" aria-current="page">Patroli</a>
      <a href="tenant.html">Tenant</a>
    </nav>
  </div>
</header>

<!-- BARIS STEMPEL: JAM & BADGE LOKASI DI BAWAHNYA -->
<div class="stempel" id="stempel" aria-label="Waktu dan lokasi"></div>

<main class="app">
  <div id="antrean-wadah"></div>
  <div id="hasil" class="hasil" role="status" hidden></div>
  <div id="muat" class="muat">Memuat konfigurasi sistem...</div>

  <form id="form" hidden novalidate>
    <!-- LANGKAH 1: NAMA PETUGAS -->
    <section class="bagian" id="b-nama">
      <h2><span class="langkah"><span>1</span></span>Nama Petugas Patroli</h2>
      <div class="medan">
        <label for="nama">Pilih Nama Anda</label>
        <div class="kombo">
          <input id="nama" class="input" type="text" autocomplete="off" placeholder="Ketik nama Anda..." aria-controls="daftar-nama">
          <ul id="daftar-nama" class="daftar" role="listbox" hidden></ul>
        </div>
        <p id="g-nama" class="galat" role="alert" hidden></p>
      </div>
    </section>

    <!-- SECTION ZONA MANUAL (DISEMBUNYIKAN OTOMATIS) -->
    <section class="bagian" id="b-zona" hidden>
      <div class="medan" id="zona-cari-wadah" hidden><input id="zona-cari" class="input" type="search"></div>
      <p class="petunjuk" id="zona-petunjuk" hidden></p>
      <div class="lantai-grup" id="zona-lantai" hidden></div>
      <div class="ubin-zona" id="zona-grup" hidden></div>
      <div class="plakat" id="zona-plakat" hidden><b id="zona-plakat-nama"></b></div>
    </section>

    <!-- LANGKAH 2: CHECKLIST PATROLI -->
    <section class="bagian" id="b-cl">
      <h2><span class="langkah"><span>2</span></span>Kondisi Area Patroli <small id="progres">0 dari 0</small></h2>
      <p class="petunjuk">Periksa area lalu jawab checklist di bawah ini.</p>
      <button type="button" id="btn-semua" class="btn btn-semua">Tandai Semua Sesuai</button>
      <div id="checklist"></div>
      <div id="blok-temuan" hidden>
        <div class="medan">
          <span class="label" id="lbl-tingkat">Tingkat Temuan</span>
          <div class="tingkat" role="radiogroup" aria-labelledby="lbl-tingkat">
            <input type="radio" name="tingkat" id="t1" value="Rendah"><label class="seg t-rendah" for="t1">Rendah</label>
            <input type="radio" name="tingkat" id="t2" value="Sedang"><label class="seg t-sedang" for="t2">Sedang</label>
            <input type="radio" name="tingkat" id="t3" value="Tinggi"><label class="seg t-tinggi" for="t3">Tinggi</label>
          </div>
        </div>
      </div>
      <div class="medan">
        <label for="catatan">Catatan Tambahan (Opsional)</label>
        <textarea id="catatan" class="input" rows="2" maxlength="500" placeholder="Tambahkan rincian jika ada..."></textarea>
      </div>
    </section>

    <!-- LANGKAH 3: FOTO BUKTI -->
    <section class="bagian" id="b-foto">
      <h2><span class="langkah"><span>3</span></span>Foto Bukti Lapangan <small id="jml-foto">0 dari 3</small></h2>
      <p class="petunjuk">Ambil foto kondisi area langsung melalui kamera HP.</p>
      <div id="foto-grid" class="foto-grid"></div>
      <button type="button" id="btn-foto" class="btn btn-foto"><span id="ikon-foto"></span><span id="btn-foto-teks">Ambil Foto Bukti</span></button>
      <p id="hint-foto" class="petunjuk"></p>
    </section>
  </form>
</main>

<!-- SUBMIT BAR & NOTIFIKASI GEOFENCE KECIL DI BAWAH TOMBOL -->
<div class="bar-kirim" id="bar-kirim" hidden>
  <div class="bar-isi">
    <p id="kurang" class="kurang"></p>
    <button type="button" id="btn-kirim" class="btn btn-utama" disabled>Kirim Laporan Patroli</button>
    <div id="pesan-geofence" class="pesan-geofence-kecil" hidden></div>
  </div>
</div>

<script src="config.js?v=15"></script>
<script src="core.js?v=15"></script>
<script src="index.js?v=15"></script>
</body>
</html>
