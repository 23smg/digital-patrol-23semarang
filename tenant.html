<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Checklist Tenant - Mall 23Semarang</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="petugas.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="icon"><i class="fa-solid fa-store"></i></div>
    <h1>CHECKLIST TENANT</h1>
    <p>Mall 23Semarang • BUKA / TUTUP</p>
  </div>

  <div class="card-app">
    <div id="loadingInit" style="text-align:center;padding:24px 0">
      <div class="spinner-border text-primary spinner-border-sm"></div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:10px">Menyelaraskan data komponen...</div>
    </div>

    <div id="alertBox" class="alert-inline"></div>

    <form id="formTenant" onsubmit="kirimTenant(event)" style="display:none">
      <div class="mb-3">
        <label class="lbl">Nama Personel Satpam</label>
        <div class="search-wrap">
          <input type="text" id="tNama" class="form-control" placeholder="Ketik & cari nama..." required autocomplete="off" oninput="filterNama(this.value)" onfocus="bukaHasil(this.value)">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <div id="tHasil" class="result-box"></div>
        </div>
      </div>

      <div class="mb-3">
        <label class="lbl">Kategori Laporan</label>
        <select id="tKategori" class="form-select" required onchange="muatChecklist()">
          <option value="" disabled selected>-- Pilih kategori --</option>
          <option value="BUKA">BUKA — Awal Operasional</option>
          <option value="TUTUP">TUTUP — Akhir Operasional</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="lbl">Tenant</label>
        <div class="search-wrap">
          <input type="text" id="tTenant" class="form-control" placeholder="Ketik & cari nama tenant..." required autocomplete="off" oninput="filterTenant(this.value)" onfocus="bukaHasilTenant()">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <div id="tTenantHasil" class="result-box"></div>
        </div>
        <div id="tFloorInfo" class="hint" style="display:none"></div>
      </div>

      <div class="section-title"><i class="fa-solid fa-list-check"></i> Checklist Tenant</div>
      <div id="tChecklist">
        <div style="font-size:12.5px;color:var(--muted);padding:12px 0">Pilih kategori laporan terlebih dahulu.</div>
      </div>

      <div class="mb-3" style="margin-top:16px">
        <label class="lbl">Catatan Tambahan (opsional)</label>
        <textarea id="tCatatan" class="form-control" rows="2" placeholder="Tambahkan info lain..." maxlength="500"></textarea>
      </div>

      <div id="tTingkatWrap" class="mb-3" style="display:none">
        <label class="lbl" style="color:#fca5a5">Tingkat Temuan</label>
        <select id="tTingkat" class="form-select">
          <option value="">-- Pilih tingkat --</option>
          <option value="Rendah">Rendah</option>
          <option value="Sedang">Sedang</option>
          <option value="Tinggi">Tinggi</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="lbl">Foto Bukti (wajib)</label>
        <input type="file" id="tFoto" class="form-control" accept="image/*" capture="environment" onchange="prosesFoto(this)" required>
        <img id="tPreview" class="foto-preview" alt="Preview">
      </div>

      <div class="gps" id="tGpsBox">
        <i class="fa-solid fa-location-crosshairs" style="color:var(--accent)" id="tGpsIcon"></i>
        <span id="tGpsText" style="color:var(--muted)">Mengunci titik koordinat GPS...</span>
      </div>

      <button type="submit" id="tBtn" class="btn-submit" disabled>
        <i class="fa-solid fa-cloud-arrow-up"></i> SIMPAN CHECKLIST TENANT
      </button>
    </form>
  </div>

  <div class="watermark">Digital Patrol System v3.0 • Mall 23Semarang</div>
</div>

<script src="config.js"></script>
<script src="core.js"></script>
<script>
var master = { daftarNama: [], daftarTenant: [], checklist: { BUKA: [], TUTUP: [] } };
var gps = { lat: "-", lng: "-", akurasi: "" };
var foto = null;
var checklist = [];
var mulai = Date.now();

function alertBox(msg, tipe) {
  var a = DP.el('alertBox');
  a.textContent = msg;
  if (tipe === 'ok') {
    a.style.background = 'rgba(16,185,129,.12)';
    a.style.border = '1px solid var(--ok)';
    a.style.color = '#6ee7b7';
  } else {
    a.style.background = 'rgba(239,68,68,.12)';
    a.style.border = '1px solid var(--err)';
    a.style.color = '#fca5a5';
  }
  a.style.display = 'block';
  clearTimeout(a._t);
  a._t = setTimeout(function () { a.style.display = 'none'; }, 5000);
}

window.addEventListener('load', function () {
  DP.api({ aksi: 'ambilDropdown' })
    .then(function (d) {
      if (d.status === 'ERROR') throw new Error(d.message);
      master.daftarNama = d.daftarNama || [];
      master.daftarTenant = d.daftarTenant || [];
      master.checklist = d.checklist || { BUKA: [], TUTUP: [] };
      DP.show('loadingInit', 'none');
      DP.el('formTenant').style.display = 'block';
      DP.sinkronJam();
    })
    .catch(function (err) {
      DP.el('loadingInit').innerHTML = '<div style="color:#fca5a5;font-size:12.5px">Gagal memuat: ' + (err.message || 'error') + '</div>';
    });

  kunciGps();

  document.addEventListener('click', function (e) {
    if (!e.target.closest('.search-wrap')) {
      DP.show('tHasil', 'none');
      DP.show('tTenantHasil', 'none');
    }
  });
});

function renderHasilNama(arr, boxId, inputId) {
  var box = DP.el(boxId);
  box.innerHTML = '';
  if (!arr.length) {
    box.innerHTML = '<div class="result-item empty">Nama tidak ditemukan</div>';
  } else {
    arr.forEach(function (n) {
      var d = document.createElement('div');
      d.className = 'result-item';
      d.textContent = n;
      d.onclick = function () { DP.el(inputId).value = n; box.style.display = 'none'; };
      box.appendChild(d);
    });
  }
  box.style.display = 'block';
}

function filterNama(q) {
  var k = q.toLowerCase().trim();
  var hasil = master.daftarNama.filter(function (n) { return n.toLowerCase().indexOf(k) >= 0; });
  renderHasilNama(hasil, 'tHasil', 'tNama');
}

function bukaHasil(q) {
  if (q.trim()) filterNama(q);
  else renderHasilNama(master.daftarNama, 'tHasil', 'tNama');
}

function renderTenantHasil(arr) {
  var box = DP.el('tTenantHasil');
  box.innerHTML = '';
  if (!arr.length) {
    box.innerHTML = '<div class="result-item empty">Tenant tidak ditemukan</div>';
  } else {
    arr.forEach(function (t) {
      var d = document.createElement('div');
      d.className = 'result-item';
      d.innerHTML = '<strong>' + DP.esc(t.n) + '</strong>' + (t.l ? '<span class="sub">' + DP.esc(t.l) + '</span>' : '');
      d.onclick = function () {
        DP.el('tTenant').value = t.n;
        box.style.display = 'none';
        var info = DP.el('tFloorInfo');
        if (t.l) { info.textContent = 'Lokasi: ' + t.l; info.style.display = 'block'; }
        else info.style.display = 'none';
      };
      box.appendChild(d);
    });
  }
  box.style.display = 'block';
}

function filterTenant(q) {
  var k = q.toLowerCase().trim();
  var hasil = master.daftarTenant.filter(function (t) { return t.n.toLowerCase().indexOf(k) >= 0; }).slice(0, 60);
  renderTenantHasil(hasil);
}

function bukaHasilTenant() {
  var q = DP.el('tTenant').value;
  if (q.trim()) filterTenant(q);
  else renderTenantHasil(master.daftarTenant.slice(0, 60));
}

function muatChecklist() {
  var k = DP.el('tKategori').value;
  if (!k) return;
  renderChecklist(master.checklist[k] || []);
}

function renderChecklist(items) {
  var w = DP.el('tChecklist');
  w.innerHTML = '';
  checklist = items.map(function (i) { return { i: i, s: '', c: '' }; });
  if (!items.length) {
    w.innerHTML = '<div style="font-size:12.5px;color:var(--muted);padding:12px 0">Tidak ada item checklist.</div>';
    return;
  }
  items.forEach(function (item, idx) {
    var d = document.createElement('div');
    d.className = 'checklist-item';
    d.dataset.idx = idx;
    d.innerHTML =
      '<div class="head">' +
        '<div class="name">' + DP.esc(item) + '</div>' +
        '<div class="opts">' +
          '<button type="button" class="opt" data-v="OK" onclick="setOpt(' + idx + ',\'OK\')">OK</button>' +
          '<button type="button" class="opt" data-v="TEMUAN" onclick="setOpt(' + idx + ',\'TEMUAN\')">Temuan</button>' +
          '<button type="button" class="opt" data-v="NA" onclick="setOpt(' + idx + ',\'NA\')">N/A</button>' +
        '</div>' +
      '</div>' +
      '<input type="text" class="catatan" placeholder="Jelaskan temuan..." oninput="setCatatan(' + idx + ',this.value)">';
    w.appendChild(d);
  });
}

function setOpt(idx, val) {
  checklist[idx].s = val;
  var item = document.querySelector('#tChecklist .checklist-item[data-idx="' + idx + '"]');
  item.querySelectorAll('.opt').forEach(function (b) { b.classList.toggle('active', b.dataset.v === val); });
  item.classList.toggle('temuan', val === 'TEMUAN');
  if (val === 'TEMUAN') item.querySelector('.catatan').focus();
  updateTingkat();
}

function setCatatan(idx, val) { checklist[idx].c = val; }

function updateTingkat() {
  var ada = checklist.some(function (x) { return x.s === 'TEMUAN'; });
  DP.show('tTingkatWrap', ada ? 'block' : 'none');
  if (!ada) DP.el('tTingkat').value = '';
}

function kunciGps() {
  if (!navigator.geolocation) {
    setGpsStatus('err', 'GPS tidak didukung.');
    DP.el('tBtn').disabled = false;
    return;
  }
  navigator.geolocation.getCurrentPosition(
    function (pos) {
      gps.lat = pos.coords.latitude;
      gps.lng = pos.coords.longitude;
      gps.akurasi = Math.round(pos.coords.accuracy || 0);
      setGpsStatus('ok', 'GPS terkunci • akurasi ±' + gps.akurasi + ' m');
      DP.el('tBtn').disabled = false;
    },
    function () {
      setGpsStatus('err', 'Izin GPS ditolak. Laporan tetap bisa dikirim.');
      DP.el('tBtn').disabled = false;
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

function setGpsStatus(status, text) {
  var box = DP.el('tGpsBox'), icon = DP.el('tGpsIcon'), txt = DP.el('tGpsText');
  box.classList.remove('ok', 'err');
  box.classList.add(status);
  icon.className = status === 'ok' ? 'fa-solid fa-circle-check' : 'fa-solid fa-triangle-exclamation';
  icon.style.color = status === 'ok' ? 'var(--ok)' : 'var(--warn)';
  txt.textContent = text;
  txt.style.color = status === 'ok' ? '#6ee7b7' : '#fcd34d';
}

function prosesFoto(input) {
  if (!input.files || !input.files[0]) return;
  DP.kompresFoto(input.files[0], 800, 0.75)
    .then(function (f) {
      foto = f;
      var prev = DP.el('tPreview');
      prev.src = 'data:image/jpeg;base64,' + f.b64;
      prev.style.display = 'block';
    })
    .catch(function () { alertBox('Gagal memproses foto.', 'err'); });
}

function kirimTenant(e, konfirmasiUlang) {
  if (e) e.preventDefault();
  var nama = DP.el('tNama').value.trim();
  var btn = DP.el('tBtn');

  if (master.daftarNama.length && master.daftarNama.indexOf(nama) < 0) {
    alertBox('Nama personel tidak terdaftar.');
    return;
  }
  if (!DP.el('tKategori').value) { alertBox('Pilih kategori.'); return; }
  if (!DP.el('tTenant').value.trim()) { alertBox('Pilih tenant.'); return; }
  if (!checklist.length) { alertBox('Checklist belum dimuat.'); return; }
  for (var i = 0; i < checklist.length; i++) {
    var c = checklist[i];
    if (!c.s) { alertBox('Item "' + c.i + '" belum dijawab.'); return; }
    if (c.s === 'TEMUAN' && c.c.trim().length < 3) { alertBox('Jelaskan temuan "' + c.i + '".'); return; }
  }
  if (!foto) { alertBox('Foto bukti wajib diambil.'); return; }

  var adaTemuan = checklist.some(function (x) { return x.s === 'TEMUAN'; });
  var tingkat = adaTemuan ? DP.el('tTingkat').value : '-';
  if (adaTemuan && !tingkat) { alertBox('Pilih tingkat temuan.'); return; }

  var payload = {
    nama: nama,
    kategori: DP.el('tKategori').value,
    tenant: DP.el('tTenant').value.trim(),
    checklist: checklist,
    catatan: DP.el('tCatatan').value.trim(),
    tingkat: tingkat,
    lat: gps.lat, lng: gps.lng, akurasi: gps.akurasi,
    fotos: [foto],
    id: DP.buatId(),
    durasiDetik: Math.round((Date.now() - mulai) / 1000),
    jamPerangkat: false, tertunda: false,
    konfirmasiUlang: konfirmasiUlang === true
  };

  btn.disabled = true;
  btn.innerHTML = '<div class="spinner-border spinner-border-sm"></div> Memproses...';

  DP.api({ aksi: 'simpanTenant', payload: payload })
    .then(function (res) {
      if (res.status === 'SUCCESS') {
        alertBox('✓ Tersimpan ' + (res.waktu || ''), 'ok');
        resetForm();
      } else if (res.status === 'KONFIRMASI') {
        if (confirm(res.message)) {
          return kirimTenant(null, true);
        }
      } else {
        alertBox('Gagal: ' + res.message);
      }
    })
    .catch(function () { alertBox('Gangguan jaringan.'); })
    .finally(function () {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> SIMPAN CHECKLIST TENANT';
    });
}

function resetForm() {
  DP.el('tNama').value = '';
  DP.el('tKategori').value = '';
  DP.el('tTenant').value = '';
  DP.el('tCatatan').value = '';
  DP.el('tFoto').value = '';
  DP.el('tPreview').style.display = 'none';
  DP.el('tPreview').src = '';
  DP.el('tFloorInfo').style.display = 'none';
  DP.el('tChecklist').innerHTML = '<div style="font-size:12.5px;color:var(--muted);padding:12px 0">Pilih kategori laporan terlebih dahulu.</div>';
  foto = null;
  checklist = [];
  mulai = Date.now();
  updateTingkat();
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</body>
</html>
